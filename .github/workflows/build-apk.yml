name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APKs
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TipCalculator.apk
          cp ghostbus/build/outputs/apk/debug/ghostbus-debug.apk GhostBus.apk
          cp fedfinder/build/outputs/apk/debug/fedfinder-debug.apk FedFinder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: "*.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Apps build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            - **FedFinder.apk**: USAJOBS search with internship filters, saved jobs and new-job alerts
            - **GhostBus.apk**: NJ Transit bus tracker (live GPS, ghost-bus warnings, your own lateness log)
            - **TipCalculator.apk**: tip calculator
          files: |
            FedFinder.apk
            GhostBus.apk
            TipCalculator.apk
