plugins {
    id "com.android.application"
}

android {
    namespace "com.nornorhub.ghostbus"
    compileSdk 35

    signingConfigs {
        // A fixed debug key (committed on purpose) so each CI build installs as an update
        // instead of failing with "App not installed". Debug keys are not secret.
        debug {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.nornorhub.ghostbus"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "org.osmdroid:osmdroid-android:6.1.20"
    testImplementation "junit:junit:4.13.2"
}
